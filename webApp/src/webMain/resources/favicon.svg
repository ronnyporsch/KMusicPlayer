<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 46 420 420">
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#FF00FF" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#FF00FF" stop-opacity="0.12"/>
      <stop offset="0.88" stop-color="#FF00FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF00FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB3FF"/>
      <stop offset="0.45" stop-color="#FF00FF"/>
      <stop offset="0.75" stop-color="#FF00FF"/>
      <stop offset="1" stop-color="#FF80FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="190" fill="url(#halo)"/>

  <!-- Atmospheric glow -->
  <circle cx="256" cy="256" r="142" fill="none" stroke="#FF00FF" stroke-width="18" opacity=".75" filter="url(#glow)"/>

  <!-- Cosmic ring -->
  <circle cx="256" cy="256" r="142" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <path d="M256 114 A142 142 0 0 1 398 256" fill="none" stroke="#FFB3FF" stroke-width="2" opacity=".8"/>

  <!-- Horizontal transmission -->
  <path d="M46 256 H225 M287 256 H466" fill="none" stroke="#FF00FF" stroke-width="4"/>

  <!-- Tuning point -->
  <circle cx="256" cy="256" r="21" fill="none" stroke="#FF00FF" stroke-width="5"/>
  <circle cx="256" cy="256" r="7" fill="#FFB3FF"/>

  <!-- Signal markers -->
  <circle cx="256" cy="114" r="3.5" fill="#FFB3FF"/>
  <circle cx="398" cy="256" r="3" fill="#FF00FF"/>
  <circle cx="114" cy="256" r="3" fill="#FF00FF"/>
</svg>
