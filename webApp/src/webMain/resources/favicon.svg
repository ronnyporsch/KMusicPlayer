<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 46 420 420">
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#B794FF" stop-opacity="0"/>
      <stop offset=".7" stop-color="#B794FF" stop-opacity=".12"/>
      <stop offset=".88" stop-color="#B794FF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#B794FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#C9B6FF"/>
      <stop offset=".75" stop-color="#A57CFF"/>
      <stop offset="1" stop-color="#E4D9FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="190" fill="url(#halo)"/>

  <!-- Violet atmospheric glow -->
  <circle cx="256" cy="256" r="142"
          fill="none" stroke="#B794FF"
          stroke-width="18" opacity=".75" filter="url(#glow)"/>

  <!-- Cosmic ring -->
  <circle cx="256" cy="256" r="142"
          fill="none" stroke="url(#ring)" stroke-width="5"/>

  <path d="M256 114 A142 142 0 0 1 398 256"
        fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".8"/>

  <!-- Horizontal transmission -->
  <path d="M46 256 H225 M287 256 H466"
        fill="none" stroke="#B794FF" stroke-width="4"/>

  <!-- Tuning point -->
  <circle cx="256" cy="256" r="21"
          fill="none" stroke="#D4C4FF" stroke-width="5"/>
  <circle cx="256" cy="256" r="7" fill="#FFFFFF"/>

  <!-- Signal markers -->
  <circle cx="256" cy="114" r="3.5" fill="#FFFFFF"/>
  <circle cx="398" cy="256" r="3" fill="#D4C4FF"/>
  <circle cx="114" cy="256" r="3" fill="#D4C4FF"/>
</svg>
